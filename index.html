<main id="game" aria-label="晴屿慢生活游戏">
<canvas id="world" aria-label="小岛场景，点击地面移动，点击树木、动物和建筑互动" tabindex="0"></canvas>

  <button class="island-brand" data-action="island"><span class="brand-mark" data-icon="leaf"></span><span><b>晴屿<span class="brand-thin">慢生活</span></b><small>一座小岛，许多小确幸</small></span></button>
  <div class="day-clock"><span data-icon="sun"></span><div><b id="dayLabel">第 1 天 · 晴</b><small id="timeLabel">09:00 · 微风</small></div></div>

</header>

river-frame .life-event p,.river-frame .life-event small{color:#fff9e8!important}@media(max-width:700px){nav{flex-wrap:wrap}dialog{max-height:87dvh;overflow:auto}.button-row{flex-wrap:wrap}}#shoreCoach{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:8px;margin:6px 0;padding:8px 4px;border-block:1px dashed #b8caa8;color:#466653;background:#faf7e8}#coachFace svg{width:42px;height:42px}#coachLine{margin:3px 0;line-height:1.45;font-size:14px}#shoreCoach button{font-size:12px;padding:3px 7px}#coachFind[hidden],#coachLine[hidden]{display:none}.coach-target{outline:3px solid #bd813c!important;outline-offset:2px}\u003c/style>\u003c/head>\u003cbody>\n\u003cmain>\u003cheader>\u003ca class=\"brand\" href=\"#\">\u003cspan class=\"seal\">晴\u003c/span>\u003cdiv>\u003ch1>晴屿 \u003ci>岸边手帐\u003c/i>\u003c/h1>\u003cp>阿栗的钓具篮\u003c/p>\u003c/div>\u003c/a>\u003cnav>\u003cbutton id=\"guideBtn\">钓法手册\u003c/button>\u003cbutton id=\"soundBtn\" aria-pressed=\"false\">心跳音 · 关\u003c/button>\u003cbutton id=\"pauseBtn\">暂停\u003c/button>\u003cbutton id=\"endBtn\">收竿结算 ↗\u003c/button>\u003c/nav>\u003c/header>\n\u003csection class=\"environment\">\u003cdiv>\u003csmall>SEASON / TIME\u003c/small>\u003cstrong id=\"clock\">秋 · 07:00\u003c/strong>\u003c/div>\u003cdiv>\u003csmall>AIR / WATER\u003c/small>\u003cstrong id=\"temperature\">21° / 18°\u003c/strong>\u003c/div>\u003cdiv>\u003csmall>CURRENT\u003c/small>\u003cstrong id=\"flow\">0.10 m/s\u003c/strong>\u003c/div>\u003cdiv>\u003csmall>OXYGEN · 估算\u003c/small>\u003cstrong id=\"oxygen\">8.6 mg/L\u003c/strong>\u003c/div>\u003cdiv class=\"env-note\">\u003csmall id=\"weatherLabel\">阴 · 风速 1.5m/s\u003c/small>\u003cspan id=\"environmentHint\">先读水，再下竿。\u003c/span>\u003c/div>\u003c/section>\n\u003cdiv class=\"workspace\">\u003caside class=\"left-panel\">\u003csection class=\"panel peg-panel\">\u003cdiv class=\"section-head\">\u003cspan>01 / 读水选位\u003c/span>\u003csmall>RIVER REACH\u003c/small>\u003c/div>\u003cdiv id=\"pegs\">\u003c/div>\u003cdiv class=\"measurement\">\u003cspan>当前落点水深\u003c/span>\u003cstrong id=\"knownDepth\">尚未探测\u003c/strong>\u003c/div>\u003cp id=\"bottomInfo\" class=\"muted\">用探底坠测量，岸上判断只是参考。\u003c/p>\u003clabel>抛投距离 \u003coutput id=\"distanceOut\">\u003c/output>\u003cinput id=\"distance\" type=\"range\" min=\"2\" max=\"9\" step=\".1\" value=\"5.4\">\u003c/label>\u003cp class=\"micro\">也可点击河面选择落点；浸水后须收回再调整。\u003c/p>\u003cbutton id=\"probeBtn\" class=\"full secondary\">⌖ 探底测深 \u003csmall>约3秒\u003c/small>\u003c/button>\u003c/section>\n\u003csection class=\"panel bait-settings\">\u003cdiv class=\"section-head\">\u003cspan>饵料盒\u003c/span>\u003csmall id=\"baitInventory\">\u003c/small>\u003c/div>\u003cdiv class=\"bait-controls\">\u003clabel>饵料\u003cselect id=\"bait\">\u003coption value=\"paste\">搓饵 · 谷物粉饵\u003c/option>\u003coption value=\"flake\">拉饵 · 轻麸饵\u003c/option>\u003coption value=\"worm\">蚯蚓段\u003c/option>\u003coption value=\"corn\">熟玉米粒\u003c/option>\u003c/select>\u003c/label>\u003clabel>饵团大小\u003cselect id=\"size\">\u003coption value=\".6\">小 · 0.6倍\u003c/option>\u003coption value=\"1\" selected>标准\u003c/option>\u003coption value=\"1.5\">大 · 1.5倍\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cp class=\"micro\">提竿后看双钩特写，再决定是否重新挂饵。\u003c/p>\u003c/section>\n\u003csection class=\"panel rig-panel\">\u003cdiv class=\"section-head\">\u003cspan>02 / 配置钓组\u003c/span>\u003cbutton id=\"rigDetailsBtn\" class=\"text-btn\">展开\u003c/button>\u003c/div>\u003cdiv class=\"two\">\u003clabel>竿长\u003cselect id=\"rod\">\u003coption value=\"3.6\">3.6 m\u003c/option>\u003coption value=\"4.5\">4.5 m\u003c/option>\u003coption value=\"5.4\" selected>5.4 m\u003c/option>\u003coption value=\"6.3\">6.3 m\u003c/option>\u003c/select>\u003c/label>\u003clabel>竿身调性\u003cselect id=\"action\">\u003coption value=\"soft\">偏软 · 缓冲\u003c/option>\u003coption value=\"medium\" selected>中等\u003c/option>\u003coption value=\"stiff\">偏硬 · 控制\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003clabel>金袖有刺\u003cselect id=\"hook\">\u003coption value=\"1\">1号金袖\u003c/option>\u003coption value=\"2\">2号金袖\u003c/option>\u003coption value=\"3\">3号金袖\u003c/option>\u003coption value=\"4\">4号金袖\u003c/option>\u003coption value=\"5\" selected>5号金袖\u003c/option>\u003coption value=\"6\">6号金袖\u003c/option>\u003coption value=\"7\">7号金袖\u003c/option>\u003coption value=\"8\">8号金袖\u003c/option>\u003c/select>\u003c/label>\u003cdiv class=\"two\">\u003clabel>主线直径 / mm\u003cselect id=\"main\">\u003c/select>\u003c/label>\u003clabel>子线直径 / mm\u003cselect id=\"leader\">\u003c/select>\u003c/label>\u003c/div>\u003clabel>浮漂种类\u003cselect id=\"floatType\">\u003coption value=\"vertical\">立漂\u003c/option>\u003coption value=\"stars\">七星漂 · 七颗总浮力\u003c/option>\u003c/select>\u003c/label>\u003clabel id=\"starSpacingRow\" hidden>漂豆间距\u003cselect id=\"starSpacing\">\u003coption value=\".015\">1.5 cm\u003c/option>\u003coption value=\".03\">3 cm\u003c/option>\u003coption value=\".06\">6 cm\u003c/option>\u003c/select>\u003c/label>\u003cdiv class=\"two\">\u003clabel>\u003cspan id=\"floatCapacityLabel\">浮漂吃铅\u003c/span>\u003cselect id=\"float\">\u003coption value=\".3\">0.3 g\u003c/option>\u003coption value=\".5\">0.5 g\u003c/option>\u003coption value=\".8\">0.8 g\u003c/option>\u003coption value=\"1\">1.0 g\u003c/option>\u003coption value=\"1.5\">1.5 g\u003c/option>\u003coption value=\"2\" selected>2.0 g\u003c/option>\u003coption value=\"3\">3.0 g\u003c/option>\u003coption value=\"4\">4.0 g\u003c/option>\u003c/select>\u003c/label>\u003clabel>铅重 / g\u003cinput id=\"lead\" type=\"number\" min=\".01\" max=\"5\" step=\".01\" value=\"1.77\">\u003c/label>\u003c/div>\u003clabel>设定钓深 \u003coutput id=\"depthOut\">1.50 m\u003c/output>\u003cinput id=\"depth\" type=\"range\" min=\".4\" max=\"4.5\" step=\".01\" value=\"1.5\">\u003c/label>\u003cdiv id=\"rigDetails\" hidden>\u003cdiv class=\"two\">\u003clabel>长子线展开长度\u003cselect id=\"hookLength\">\u003coption value=\"0.12\">12 cm\u003c/option>\u003coption value=\"0.18\" selected>18 cm\u003c/option>\u003coption value=\"0.25\">25 cm\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003clabel>钓组模式\u003cselect id=\"style\">\u003coption value=\"fixed\">固定铅 · 灵敏观察\u003c/option>\u003coption value=\"running\">底坠跑铅 · 需坠到底\u003c/option>\u003c/select>\u003c/label>\u003clabel>扬竿力度 \u003coutput id=\"powerOut\">55%\u003c/output>\u003cinput id=\"power\" type=\"range\" min=\"25\" max=\"95\" value=\"55\">\u003c/label>\u003clabel>双钩有效负载 / g\u003cinput id=\"hookWeight\" type=\"number\" min=\".01\" max=\".5\" step=\".001\" value=\".088\">\u003c/label>\u003cp class=\"micro\">双钩差3cm为当前绑法。双钩负载初值为游戏估值，可按半水校漂调整；来图未提供钩重和拉力。\u003c/p>\u003c/div>\u003cdiv class=\"button-row\">\u003cbutton id=\"stripBtn\">卸饵\u003c/button>\u003cbutton id=\"calibrateBtn\">半水校漂\u003c/button>\u003cbutton id=\"lineBtn\">检查换线\u003c/button>\u003c/div>\u003cdiv id=\"rigReadout\" class=\"micro\">\u003c/div>\u003cp id=\"hookSpecs\" class=\"micro\">\u003c/p>\u003cp id=\"lineReadout\" class=\"micro\">\u003c/p>\u003cp id=\"floatReadout\" class=\"micro\">\u003c/p>\u003cdetails class=\"tackle-chart\">\u003csummary>查看来图配重参考\u003c/summary>\u003cdiv id=\"leadTable\">\u003c/div>\u003cp class=\"micro\">来图参考，不锁定配重。钩＋铅不含饵料；七星漂规格为七颗合计，实际需空钩半水校准。\u003c/p>\u003c/details>\u003cdetails class=\"tackle-chart\">\u003csummary>金袖有刺 · 查看来图规格\u003c/summary>\u003cdiv id=\"hookTable\">\u003c/div>\u003cp class=\"micro\">仅对应来图产品；建议钓重是选型参考，不是拉力极限。图示成品线长12cm，不与钩号绑定。主线0.4–2.0mm、子线0.2–1.0mm，步进0.1mm，按玩家要求使用实际直径；结节负荷为本作估值，非品牌实测。\u003c/p>\u003c/details>\u003c/section>\u003c/aside>\n\u003csection class=\"center\">\u003cdiv class=\"river-head\">\u003cdiv>\u003csmall>THE WATER TELLS A STORY\u003c/small>\u003ch2 id=\"pegTitle\">内湾 · 缓流滩\u003c/h2>\u003c/div>\u003cspan id=\"phase\">岸上准备\u003c/span>\u003c/div>\u003cdiv class=\"river-frame\">\u003cdiv class=\"scene-view\">\u003ccanvas id=\"river\" tabindex=\"0\" aria-label=\"河面视野，点击河面选择抛投落点\">\u003c/canvas>\u003cdiv class=\"scene-tag\">\u003ci>\u003c/i>\u003cspan id=\"sceneTag\">观察水纹、回流与岸边结构\u003c/span>\u003c/div>\u003cdiv class=\"float-lens\">\u003cdiv>\u003cspan id=\"lensTitle\">漂相近观\u003c/span>\u003csmall id=\"floatLabel\">尚未下竿\u003c/small>\u003c/div>\u003ccanvas id=\"floatView\" width=\"220\" height=\"320\" aria-label=\"浮漂与出水双钩放大视图\">\u003c/canvas>\u003cp id=\"floatHint\">露目随负载与水流变化\u003c/p>\u003c/div>\u003ccanvas id=\"eventFx\" aria-hidden=\"true\">\u003c/canvas>\u003c/div>\u003csection id=\"lifeEvent\" class=\"panel life-event\" hidden aria-live=\"polite\">\u003cdiv id=\"lifeVisual\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"section-head\">\u003cstrong id=\"lifeTitle\">\u003c/strong>\u003csmall id=\"lifeCountdown\">\u003c/small>\u003c/div>\u003cp id=\"lifeDescription\" class=\"micro\">\u003c/p>\u003cdiv class=\"button-row\">\u003cbutton id=\"lifeHandle\" class=\"secondary\">\u003c/button>\u003cbutton id=\"lifeSkip\">暂缓 · 继续钓鱼\u003c/button>\u003c/div>\u003cprogress id=\"lifeProgress\" max=\"1\" value=\"0\">\u003c/progress>\u003c/section>\u003cdiv class=\"scene-bottom\">\u003cspan id=\"castTimer\">岸上 · 可检查双钩\u003c/span>\u003cbutton id=\"cutawayBtn\" aria-pressed=\"false\">教学剖面 · 关\u003c/button>\u003c/div>\u003cdiv id=\"toast\" role=\"status\" hidden>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"status-line\" aria-live=\"polite\">\u003cspan class=\"status-dot\">\u003c/span>\u003cp id=\"message\">先探底测水深，再进行半水带钩调漂。\u003c/p>\u003cspan id=\"elapsed\">00′\u003c/span>\u003c/div>\n\u003caside id=\"shoreCoach\" aria-label=\"阿栗陪钓\">\u003cspan id=\"coachFace\" aria-hidden=\"true\">\u003c/span>\u003cdiv>\u003cb>阿栗\u003c/b>\u003cp id=\"coachLine\" aria-live=\"polite\">\u003c/p>\u003cbutton id=\"coachFind\" type=\"button\">找这个操作\u003c/button>\u003c/div>\u003cbutton type=\"button\" id=\"coachSwitch\">自己试试\u003c/button>\u003c/aside>\n\u003csection class=\"action-dock\" aria-label=\"钓鱼操作台\">\n\u003cdiv id=\"fishingControls\">\u003cdiv class=\"dock-summary\">\u003cspan id=\"actionContext\">先挂饵，再抛竿\u003c/span>\u003cdiv id=\"baitState\" class=\"bait-state\">\u003c/div>\u003c/div>\n\u003cdiv class=\"main-actions\">\n\u003cbutton id=\"baitBtn\" class=\"action-button bait-action\">\u003cspan class=\"action-symbol\" aria-hidden=\"true\">◉\u003c/span>\u003cspan>\u003cstrong>挂饵\u003c/strong>\u003csmall>双钩重新挂饵\u003c/small>\u003c/span>\u003ckbd>B\u003c/kbd>\u003c/button>\n\u003cbutton id=\"castBtn\" class=\"action-button cast-action\">\u003cspan class=\"action-symbol\" aria-hidden=\"true\">↗\u003c/span>\u003cspan>\u003cstrong>抛竿\u003c/strong>\u003csmall>抛向选定落点\u003c/small>\u003c/span>\u003ckbd>C\u003c/kbd>\u003c/button>\n\u003cbutton id=\"strikeBtn\" class=\"action-button lift-action\">\u003cspan class=\"action-symbol\" aria-hidden=\"true\">↑\u003c/span>\u003cspan>\u003cstrong>提竿\u003c/strong>\u003csmall id=\"liftActionHint\">抓口刺鱼 / 收回钓组\u003c/small>\u003c/span>\u003ckbd>SPACE\u003c/kbd>\u003c/button>\n\u003c/div>\u003c/div>\u003csection id=\"fightPanel\" class=\"fight-panel\" hidden>\u003cdiv class=\"section-head\">\u003cspan>\u003ci class=\"live-dot\">\u003c/i> 中鱼 · 控鱼操作\u003c/span>\u003cstrong id=\"fightDistance\">\u003c/strong>\u003cspan id=\"fightFishName\">\u003c/span>\u003c/div>\u003cdiv class=\"fight-meters\">\u003clabel>线组负荷 \u003cmeter id=\"tension\" min=\"0\" max=\"1.3\" low=\".2\" high=\".8\" optimum=\".45\">\u003c/meter>\u003coutput id=\"tensionValue\">\u003c/output>\u003c/label>\u003clabel>鱼的体力 \u003coutput id=\"fishEnergyValue\">100%\u003c/output> \u003cmeter id=\"fishEnergy\" min=\"0\" max=\"100\" value=\"100\">\u003c/meter>\u003c/label>\u003c/div>\u003clabel class=\"rod-angle\">持竿角度 \u003coutput id=\"angleOut\">48°\u003c/output>\u003cinput id=\"angle\" type=\"range\" min=\"15\" max=\"85\" value=\"48\">\u003c/label>\u003cdiv class=\"fight-buttons\" aria-label=\"遛鱼操作\">\u003cbutton id=\"leftRod\">↙ 左牵 \u003ckbd>A\u003c/kbd>\u003c/button>\u003cbutton id=\"pullBtn\">按住稳提 \u003ckbd>W\u003c/kbd>\u003c/button>\u003cbutton id=\"rightRod\">右牵 ↘ \u003ckbd>D\u003c/kbd>\u003c/button>\u003cbutton id=\"netBtn\" class=\"primary\">抄鱼 \u003ckbd>N\u003c/kbd>\u003c/button>\u003c/div>\u003cp id=\"fightHint\" class=\"micro\">鱼冲刺时降低竿角、松开稳提；避开水草并防止长时间松线。\u003c/p>\u003c/section>\n\u003c/section>\n\u003c/section>\n\u003caside class=\"right-panel\">\u003csection class=\"panel angler-panel\">\u003cdiv class=\"section-head\">\u003cspan>钓者状态\u003c/span>\u003csmall>BODY / ESTIMATE\u003c/small>\u003c/div>\u003cdiv class=\"heartbeat\">\u003csvg viewBox=\"0 0 170 42\" aria-hidden=\"true\">\u003cpath d=\"M0 25h37l8-9 8 14 9-26 10 35 8-14h90\"/>\u003c/svg>\u003cstrong id=\"heart\">68 \u003csmall>BPM\u003c/small>\u003c/strong>\u003c/div>\u003clabel>身体疲劳 \u003coutput id=\"fatigueText\">6%\u003c/output>\u003cprogress id=\"fatigue\" max=\"100\" value=\"6\">\u003c/progress>\u003c/label>\u003clabel>水分状态 \u003coutput id=\"waterText\">100%\u003c/output>\u003cprogress id=\"hydration\" max=\"100\" value=\"100\">\u003c/progress>\u003c/label>\u003cdiv class=\"button-row\">\u003cbutton id=\"restBtn\">坐下休息\u003c/button>\u003cbutton id=\"drinkBtn\">饮水150mL\u003c/button>\u003c/div>\u003cp id=\"bodyHint\" class=\"micro\">放松持竿，稳定呼吸。心率为游戏估算。\u003c/p>\u003clabel class=\"check\">\u003cinput type=\"checkbox\" id=\"steadyView\"> 稳定镜头 · 关闭画面晃动\u003c/label>\u003c/section>\n\u003csection class=\"panel field-guide\">\u003cdiv class=\"section-head\">\u003cspan>水情判断\u003c/span>\u003csmall>FIELD NOTES\u003c/small>\u003c/div>\u003cdiv id=\"advice\">\u003c/div>\u003cdiv class=\"rule\">\u003c/div>\u003ch3>本河段鱼种\u003c/h3>\u003cdiv id=\"species\">\u003c/div>\u003cp class=\"micro\">本作使用虚构温带淡水河段。没有统一适用所有河流的最佳调目或钓深。\u003c/p>\u003c/section>\u003csection class=\"panel catch-book\">\u003cdiv class=\"section-head\">\u003cspan>鱼获手记\u003c/span>\u003cb id=\"catchCount\">0 尾\u003c/b>\u003c/div>\u003cdiv id=\"catches\">\u003cp class=\"muted\">每一尾，都是读懂河流的回信。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"journal panel\">\u003cdiv class=\"section-head\">\u003cspan>水边记录\u003c/span>\u003cbutton id=\"saveBtn\" class=\"text-btn\">保存岸上记录\u003c/button>\u003c/div>\u003cdiv id=\"log\">\u003c/div>\u003c/section>\u003c/aside>\u003c/div>\n\u003cfooter>\u003cspan>晴屿 · 钓行手帐 · 手竿双钩浮漂河钓\u003c/span>\u003cspan>咬口等待经过压缩 · 负载、鱼性与身体状态为游戏近似\u003c/span>\u003c/footer>\u003c/main>\n\n\u003cdialog id=\"startDialog\">\u003cdiv class=\"dialog-inner\">\u003csmall class=\"eyebrow\">A QUIET DAY, A LIVING RIVER\u003c/small>\u003ch2>去河边，读懂一支漂。\u003c/h2>\u003cp>从找底、挂饵到中鱼后的每一次侧牵。水在流动，饵在散落，你的身体也在回应。\u003c/p>\u003cdiv class=\"two\">\u003clabel>季节\u003cselect id=\"season\">\u003coption value=\"spring\">春 · 水温回升\u003c/option>\u003coption value=\"summer\">夏 · 温暖长日\u003c/option>\u003coption value=\"autumn\" selected>秋 · 水温渐凉\u003c/option>\u003coption value=\"winter\">冬 · 深水缓食\u003c/option>\u003c/select>\u003c/label>\u003clabel>岛上时间\u003coutput id=\"arrival\">\u003c/output>\u003c/label>\u003clabel>气温 / °C\u003cinput id=\"air\" type=\"number\" min=\"-5\" max=\"38\" value=\"21\">\u003c/label>\u003clabel>天气\u003cselect id=\"weather\">\u003coption value=\"cloud\">多云\u003c/option>\u003coption value=\"sun\">晴\u003c/option>\u003coption value=\"rain\">细雨 · 水流略增\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv class=\"intro-steps\">\u003cspan>① 探底\u003c/span>\u003cspan>② 空钩半水校漂\u003c/span>\u003cspan>③ 挂饵设深\u003c/span>\u003cspan>④ 看漂扬竿\u003c/span>\u003cspan>⑤ 遛鱼放流\u003c/span>\u003c/div>\u003cp class=\"micro\">钩型与地域钓法存在差异。本作先聚焦手竿定长线、双钩、粉饵与跑铅；身体指标与环境模型为游戏估算。等待压缩，鱼口与遛鱼保持实时操作。\u003c/p>\u003cdiv class=\"button-row\">\u003cbutton id=\"loadBtn\">恢复岸上记录\u003c/button>\u003cbutton id=\"startBtn\" class=\"primary\">开启这次河钓 ↗\u003c/button>\u003c/div>\u003c/div>\u003c/dialog>\n\u003cdialog id=\"guideDialog\">\u003cdiv class=\"dialog-inner\">\u003cbutton data-close=\"guideDialog\" class=\"close\">×\u003c/button>\u003csmall class=\"eyebrow\">READING WATER / READING THE FLOAT\u003c/small>\u003ch2>先理解，再扬竿。\u003c/h2>\u003ch3>1. 找底与调钓\u003c/h3>\u003cp>选择钓位与落点，用“探底测深”取得当前水深。卸饵后进行“半水校漂”，此时双钩不触底，调铅观察空钩露目：减铅会上升、加铅会下沉。每目约0.025g只适用于本作默认漂尾模型。挂饵会增加负载并压下漂目。\u003c/p>\u003cp>可独立选择立漂或七星漂、吃铅规格和铅皮重量。七星漂的吃铅是七颗合计，以水面漂豆颗数和沉浮观察鱼口；间距影响位移读数。配重表仅转录来图参考，实际还受钩饵、连接件和走水影响，应半水校准。\u003c/p>\u003ch3>2. 设深与走水\u003c/h3>\u003cp>钓深是浮漂至下钩的线长，水流使线倾斜，垂直深度会略小。短于水深为离底，接近水深时下钩先触底，上钩相差3cm；钩饵触底后部分重量由河底支撑。设得过深会出现松线、漂横卧、信号减弱。底坠跑铅需要坠真正落底并足以抗流；仅切换名称不会自动稳漂。\u003c/p>\u003ch3>3. 饵料与漂相\u003c/h3>\u003cp>双钩挂饵每次消耗两份。粉饵随水温、流速浸散，蚯蚓和玉米以松脱、啄食损耗为主；轻麸散得更快。残饵变轻也会使漂上升。正常视图不显示水下精确残量，定时收回检查，再手动挂饵。连续有力的下顿、持续上送可能是入口；细碎抖动、缓慢走漂也可能是啄饵或水流。鱼口不是每次抖动都能扬中。\u003c/p>\u003ch3>4. 扬竿与遛鱼\u003c/h3>\u003cp>点击操作台“提竿”或按空格，立即扬竿并显示抬竿、收紧线和钓组出水动画；判定发生在按键瞬间。探底、抛投和校漂时，“提竿”收回钓组；守漂时用于抓口。力度在钓组详情中调整；细线、硬竿、过猛扬竿更容易切线。中鱼后，河面下方的操作台切换为遛鱼控制，无需向下翻页。观察张力：按住W稳提、A/D侧向引导，冲刺时松开稳提并降低竿角。定长线没有卷线器与放线功能。鱼到1.5米内、体力低于45%、线负荷低于85%时可抄鱼。保持手湿、托鱼摘钩，再在水中放流。\u003c/p>\u003ch3>5. 环境与钓者\u003c/h3>\u003cp>季节与时刻决定初始水温、光照和鱼的活动倾向；气温不能瞬间改变水温。显示的溶氧是估算，不是传感器读数。长时间持竿和遛鱼增加疲劳，激动使心跳加快。休息缓慢恢复疲劳，饮水只补充水分。稳定镜头关闭画面轻颤，不修改水下结果。\u003c/p>\u003ch3>6. 岸边突发事件\u003c/h3>\u003cp>偶尔会遇到来电、尿急、肠胃不适或蚊虫。可明确选择收竿处理，或暂缓继续钓鱼。处理过程经过时间压缩；遛鱼中请先稳鱼，不会替你自动收走中鱼的钓组。事件倒计时随暂停一起停止，来电时视野短促震动；蚊虫带着嗡鸣飞字掠过，偶尔扑近眼镜遮挡并引起甩头；尿急和肠胃不适使竿尖、漂相出现持续不规则晃动。暂缓尿急后不适会持续，处理完成后消退。稳定镜头可关闭画面晃动。全部事件在河面窗口内展示提示、处理进度和结束反馈；暂停时倒计时与进度停止。\u003c/p>\u003ch3>操作\u003c/h3>\u003cp>B挂饵，C抛竿，空格提竿（抓口或收回），R仍可直接收回；A/D侧向、W稳提、N抄鱼；P暂停。触屏可使用全部按钮。点击河面改变抛投距离与横向落点。收竿结算可查看本次鱼获，再开启新一次河钓。\u003c/p>\u003ch3>模型边界\u003c/h3>\u003cp>本作并非真实钓鱼的完整数字孪生：饵团、河床、鱼类摄食、线结承载与人体反馈均为简化模型，不模拟具体品牌、真实水文、倒刺深吞或无限钓法。资料与具体近似见源码中的《玩法与模型说明.md》。\u003c/p>\u003c/div>\u003c/dialog>\n\u003cdialog id=\"fishDialog\">\u003cdiv class=\"dialog-inner\">\u003csmall class=\"eyebrow\">A MOMENT WORTH REMEMBERING\u003c/small>\u003ccanvas id=\"fishPortrait\" width=\"560\" height=\"230\">\u003c/canvas>\u003ch2 id=\"caughtName\">鱼已入网\u003c/h2>\u003cp id=\"caughtDetails\">\u003c/p>\u003cp id=\"careText\">鱼保持在湿抄网和浅水中。\u003c/p>\u003cbutton id=\"careBtn\" class=\"primary full\">先将双手沾湿\u003c/button> \u003cbutton id=\"keepBtn\" hidden>托鱼入篓 · 带回岛上\u003c/button>\u003c/div>\u003c/dialog>\n\u003cdialog id=\"endDialog\">\u003cdiv class=\"dialog-inner\">\u003csmall class=\"eyebrow\">UNTIL THE NEXT RIVER\u003c/small>\u003ch2>这次，河流给了什么答案？\u003c/h2>\u003cdiv id=\"summary\">\u003c/div>\u003cdiv class=\"button-row\">\u003cbutton id=\"continueBtn\">继续垂钓\u003c/button>\u003cbutton id=\"newTripBtn\" class=\"primary\">开启下一次河钓\u003c/button>\u003c/div>\u003c/div>\u003c/dialog>\n\u003cscript>\n/* Riverbank: seeded game approximation; SI units except rig mass in grams. */\n(function(root){'use strict';\nconst clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;\nconst SEASONS={spring:{name:'春',air:17,water:13,sunrise:6,sunset:18.5},summer:{name:'夏',air:29,water:25,sunrise:5,sunset:19.3},autumn:{name:'秋',air:21,water:18,sunrise:6,sunset:17.8},winter:{name:'冬',air:7,water:6,sunrise:7,sunset:17}};\nconst BAITS={paste:{name:'搓饵 · 谷物粉饵',mass:.065,halfLife:58,scent:1,code:'谷物'},flake:{name:'拉饵 · 轻麸饵',mass:.04,halfLife:30,scent:1.15,code:'轻麸'},worm:{name:'蚯蚓段',mass:.05,halfLife:620,scent:.75,code:'蚯蚓'},corn:{name:'熟玉米粒',mass:.09,halfLife:1250,scent:.45,code:'玉米'}};\nconst FISH={crucian:{name:'鲫鱼',range:[.12,.65],opt:19,width:12,hook:4,food:{paste:1,flake:1.1,worm:1,corn:.25},color:'#b8b79b'},carp:{name:'鲤鱼',range:[.7,3.4],opt:25,width:13,hook:7,food:{paste:1,flake:.6,worm:.7,corn:1.3},color:'#aa8450'},bream:{name:'鳊鱼',range:[.25,1.1],opt:23,width:12,hook:5,food:{paste:1,flake:1,worm:.6,corn:.65},color:'#99b0ad'},dace:{name:'白条',range:[.03,.13],opt:23,width:11,hook:3,food:{paste:.7,flake:1.4,worm:.9,corn:.03},color:'#c3d9cf'}};\nconst PEGS=[{name:'内湾 · 缓流滩',base:1.35,current:.10,bottom:'泥沙',weed:.18,rock:.05,habitat:{crucian:1.2,carp:.7,bream:.6,dace:.8}},{name:'芦苇外缘 · 坡坎',base:1.9,current:.24,bottom:'砂砾 / 零星水草',weed:.55,rock:.14,habitat:{crucian:1,carp:1.2,bream:1,dace:.55}},{name:'主槽边缘 · 深水',base:2.65,current:.44,bottom:'砾石 / 深坎',weed:.07,rock:.4,habitat:{crucian:.45,carp:1.15,bream:1.3,dace:.3}}];\n// Actual millimetre diameters requested by the player; 0.1 mm steps, no nominal line numbers.\nconst MAIN_LINES=Array.from({length:17},(_,i)=>({mm:Number((.4+i*.1).toFixed(1))})),LEADER_LINES=Array.from({length:9},(_,i)=>({mm:Number((.2+i*.1).toFixed(1))})),LINES=Array.from({length:19},(_,i)=>({mm:Number((.2+i*.1).toFixed(1))}));\nconst LEAD_REFERENCE=[{float:1.5,total:[1.05,1.35],lead:[.8,1.1]},{float:2,total:[1.4,1.8],lead:[1.1,1.5]},{float:3,total:[2.1,2.7],lead:[1.7,2.3]}];\n// Dimensions and suggested fish weights transcribed from the player's supplied 金袖有刺 chart.\nconst SLEEVE_HOOKS=[null,...[ [3.2,7.5,'0.2斤以下'],[4,8,'2–4两'],[4.5,9,'5–8两'],[5,10,'0.8–1斤'],[5.5,10.5,'1–2斤'],[6,11,'1.5–3斤'],[6.2,12.5,'2–4斤'],[7,14,'3–6斤'] ].map(([width,height,suggested],i)=>({size:i+1,width,height,suggested}))];\nconst LIFE_TASKS={phone:{title:'老婆来电话了',detail:'手机在响。收好钓组再接，还是先守住这一口？',wait:22,duration:12,action:'收竿接电话'},workcall:{title:'有一通工作来电',detail:'临时有事找你；可以收竿接听，也可以选择不接。',wait:20,duration:14,action:'收竿接听'},toilet:{title:'突然有点尿急',detail:'岸边有公厕。先收竿，再把钓具放稳；过程时间经过压缩。',wait:30,duration:18,action:'收竿去厕所'},stomach:{title:'肚子不太舒服',detail:'肠胃开始闹腾，需要去趟厕所；回来记得查看水分状态。',wait:22,duration:25,action:'收竿去处理'},mosquito:{title:'蚊虫围过来了',detail:'叮咬让持竿有点分心，可以收竿擦驱蚊用品。',wait:32,duration:8,action:'收竿驱蚊'}};\nclass RiverGame{\n constructor(seed=Date.now()){this.seed=seed>>>0;this.rngState=this.seed;this.phase='idle';this.time=0;this.lifeSeed=(this.seed^0x4b12cd34)>>>0;this.life={elapsed:0,next:55+this.lifeRandom()*25,task:null,history:[]};this.urgency=0;this.minutes=0;this.events=[];this.log=[];this.catches=[];this.inventory={paste:50,flake:50,worm:24,corn:30,water:600};this.rig={rod:5.4,action:'medium',main:.4,leader:.2,hook:5,hookWeight:.088,hookLength:.18,floatType:'vertical',starSpacing:.03,float:2,lead:1.77,depth:1.5,bait:'paste',size:1,style:'fixed',power:55};this.env={season:'autumn',hour:7,air:21,weather:'cloud',wind:1.5};this.body={fatigue:6,hydration:100,adrenaline:0,heart:68,effort:0};this.peg=0;this.target={distance:5.4,lateral:0};this.hooks=[0,0];this.condition=100;this.leaderCondition=100;this.attempts=0;this.misses=0;this.lost=0;this.feed=0;this.f function openMap(){showSheet('map',header('晴屿散步地图','点一个目的地，慢慢走过去。','map')+`<div class="map-wrap"><canvas id="miniMap" width="660" height="510" aria-label="全岛地图，点击地面自动前往"></canvas></div><div class="map-legend"><span><i style="background:#e5a88f"></i>我的位置</span><span><i style="background:#9cab84"></i>小屋与杂货铺</span><span><i style="background:#75b8b2"></i>池塘与海边钓场</span></div><p class="note">散步手帐：${S.book.filter(x=>String(x).startsWith('stamp')).length} / 3 枚。小屋花圃东边可捕虫，南岸帐篷旁有旅客，海钓栈桥旁可搭船。到各地木牌旁盖章。</p>`);const c=$('#miniMap'),g=c.getContext('2d'),s=Math.min(660/WORLD_W,510/WORLD_H),ox=(660-WORLD_W*s)/2,oy=(510-WORLD_H*s)/2;g.fillStyle='#8fc9c1';g.fillRect(0,0,660,510);g.save();g.translate(ox,oy);g.scale(s,s);g.drawImage(groundCache,0,0);for(const o of objects){if(o.kind==='aquarium')drawObject(g,o,0);if(['home','shop','neighborhouse'].includes(o.kind))drawHouse(g,o);if(['fruit','pine','tree'].includes(o.kind))drawTree(g,o,0);}g.restore();const names=[['我的小屋',655,640],['花圃',800,930],['杂货铺',1280,500,1280,525],['池塘',1500,690,1425,854],['水族馆',1530,994],['海钓栈桥',1020,1410],['北岸果林',2310,360],['东侧湿地',2460,1000],['南岸露营地',1770,1900,1770,1970]];names.forEach(([n,x,y])=>label(g,n,x*s+ox,y*s+oy,'#fff6dbe6','#778563',9));ellipse(g,P.x*s+ox,P.y*s+oy,6,6,'#e59d84');ellipse(g,P.x*s+ox,P.y*s+oy,2,2,'#fff7d8');c.addEventListener('pointerup',e=>{if(S.room){toast('先离开小屋，再去岛上散步吧。');return;}const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width*660,my=(e.clientY-r.top)/r.height*510,hit=names.map(n=>({n,dx:Math.abs(mx-(n[1]*s+ox)),dy:Math.abs(my-(n[2]*s+oy))})).filter(v=>v.dx<=v.n[0].length*5+7&&v.dy<=13).sort((a,b)=>a.dx+a.dy-b.dx-b.dy)[0]?.n,x=hit?(hit[3]??hit[1]):(mx-ox)/s,y=hit?(hit[4]??hit[2]):(my-oy)/s;if(routeTo(x,y)){P.target=null;closeSheet();toast('出发，慢慢走过去。');}else toast('那里还不能到达，选岛上的空地试试。');});}

function validSave(s){if(!s||s.version!==1||typeof s.name!=='string'||s.name.length>8||!Number.isInteger(s.day)||s.day<1||s.day>100000||!Number.isFinite(s.time)||s.time<0||s.time>=24||!Number.isFinite(s.coins)||s.coins<0||s.coins>1e9||!s.bag||typeof s.bag!=='object')return false;for(const[k,v]of Object.entries(s.bag))if(!ITEMS[k]||!Number.isInteger(v)||v<0||v>1e6)return false;if(!/^#[a-fA-F0-9]{6}$/.test(s.shirt)||!/^#[a-fA-F0-9]{6}$/.test(s.roof))return false;for(const key of['met','talked','gifted','requests','claimed','book','gathered','decor'])if(!Array.isArray(s[key])||s[key].length>1000)return false;if(!s.book.every(k=>typeof k==='string')||!s.stats||typeof s.stats!=='object'||!s.friendship||typeof s.friendship!=='object')return false;for(const o of s.decor)if(!o||!ITEMS[o.kind]?.decor||!Number.isFinite(o.x)||!Number.isFinite(o.y)||o.x<0||o.x>WORLD_W||o.y<0||o.y>WORLD_H)return false;for(const v of Object.values(s.friendship||{}))if(!Number.isFinite(v)||v<0||v>100)return false;for(const v of Object.values(s.stats||{}))if(!Number.isFinite(v)||v<0||v>1e9)return false;if(s.pathTiles!==undefined&&(!Array.isArray(s.pathTiles)||s.pathTiles.length>400||!s.pathTiles.every(p=>p&&Number.isInteger(p.x)&&Number.isInteger(p.y)&&p.x>=0&&p.x<=WORLD_W&&p.y>=0&&p.y<=WORLD_H&&['sand','stone'].includes(p.k))))return false;return s.plants&&typeof s.plants==='object'&&Object.keys(s.plants).length<=12&&Object.values(s.plants).every(p=>p&&Number.isFinite(p.at)&&/^#[a-fA-F0-9]{6}$/.test(p.color));}
let pendingImport=null;function importSave(){const f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=async()=>{const file=f.files[0];if(!file)return;if(file.size>200000)return toast('这份文件太大，不像晴屿存档。');try{const data=JSON.parse(await file.text());if(data.game!=='sunny-island-life'||!validSave(data.state))throw Error();pendingImport=data.state;showSheet('importConfirm',header('读取小岛备份','确认后会替换当前设备的小岛进度。','book')+`<div class="request-box">${esc(pendingImport.name)}的小岛 · 第 ${pendingImport.day} 天<br>${pendingImport.coins.toLocaleString()} 贝币 · ${pendingImport.decor.length} 件家具</div><div class="button-row"><button class="secondary" data-action="close">保留现在的小岛</button><button class="primary" data-action="importConfirm">确认读取</button></div>`);}catch(e){toast('这不是有效的晴屿存档，未改动当前进度。');}};f.click();}

function dispatch(action,id){if(busy&&action!=='sound')return;if(action==='clockMode')return changeClock();if(action==='nightPrint')return keepSky(id);if(action==='pierFish'&&modal==='skyDock')return openFishing('sea');if(action.startsWith('day:'))return dayAction(action.slice(4),id);switch(action){case'picnicOpen':picnicPanel();break;case'picnicBring':picnicBring(id);break;case'picnicGo':picnicGo();break;case'picnicMeet':picnicMeet();break;case'arrivalGuide':openArrival();break;case'arrivalWalk':arrivalWalk();break;case'start':startGame();break;case'close':closeSheet();break;case'bag':openBag();break;case'bagTab':openBag(id);break;case'selectItem':$$('.item-card').forEach(x=>x.classList.toggle('selected',x.dataset.id===id));$('#itemDetail').innerHTML=bagDetail(id);break;case'craft':openCraft();break;case'craftItem':craftItem(id);break;case'decorate':openDecorate();break;case'place':startPlacement(id);break;case'placeConfirm':confirmPlacement();break;case'placeCancel':cancelPlacement();break;case'rotate':if(placing)placing.rotation=(placing.rotation+1)%2;break;case'reclaim':{const i=S.decor.findIndex(o=>String(o.id)===String(id));if(i>=0){add(S.decor[i].kind);S.decor.splice(i,1);save();navCache=null;closeSheet();toast('家具已回到背包，随时可以换个地方。');}break;}case'inviteBloom':inviteBloom(id);break;case'bloomGuest':bloomGuest(id);break;case'bloomMail':openBloomMail();break;case'friends':openFriends();break;case'findFriend':{if(S.room)return toast('先出门，再去找邻居吧。');closeSheet();const n=objects.find(o=>o.id===Number(id));setTimeout(()=>approach(n),250);break;}case'tastePie':if(modal==='keepsake'&&piePhase()==='served'){S.pieTasted=S.pieDay;save();chime();seeKeepsake(keepsakes[0]);}break;case'visitKeepsake':{const o=objects.find(k=>k.kind==='keepsake'&&k.owner===Number(id));if(o)strollTo([o],'去'+o.place+'看看。');break;}case'errandWalk':{const e=errands[id];if(e)strollTo(objects.filter(o=>e.k.includes(o.kind)&&!isGathered(o.id)),e.where+'，到了可以自己采。');break;}case'gift':gift(id);break;case'giveGift':giveGift(id);break;case'request':fulfillRequest(id);break;case'wishes':openWishes();break;case'claim':claim(id);break;case'relicHall':openRelicHall();break;case'identify':identifyRelic();break;case'offerRelic':offerRelic(id);break;case'inkAlbum':inkAlbum();break;case'pinPrint':if(modal==='inkAlbum'&&printFor(id)){S.pinnedPrint=id;save();chime();inkAlbum();toast('鱼拓已挂到水族馆。');}break;case'tank':openTank();break;case'donateFish':donateFish(id);break;case'book':openBook();break;case'bookTab':openBook(id);break;case'specimen':return specimenPage(id);case'bookDetail':$('#bookDetail').innerHTML=`<div class="item-detail"><p><b>${ITEMS[id].name}</b><br>${ITEMS[id].desc}</p></div>`;break;case'shopTab':openShop(id);break;case'buy':buy(id);break;case'sell':sell(id);break;case'roof':S.roof=id;save();openHome();break;case'enterHome':enterHome();break;case'upgradeHome':if(S.coins>=800&&S.homeLevel===1){S.coins-=800;S.homeLevel=2;save();updateHUD();openHome();chime();toast('小屋门前，多了一份花香。');}break;case'rest':openRest();break;case'sleep':sleep();break;case'findGarden':if(S.room)return toast('先离开小屋，再去花圃吧。');strollTo(objects.filter(o=>o.kind==='plot'),'去花圃散步，到了再选要照料的地块。');break;case'interact':if(nearest)interactObject(nearest);else toast('走近树木、海边、花圃或邻居，再互动吧。');break;case'zoomIn':cam.goalZoom=Math.min(1.6,cam.goalZoom+.15);break;case'zoomOut':cam.goalZoom=Math.max(.45,cam.goalZoom-.15);break;case'map':openMap();break;case'island':openIsland();break;case'producer':openProducer();break;case'settings':openSettings();break;case'sound':soundOn=!soundOn;S.music=soundOn;save();$('#soundBtn').innerHTML=icon(soundOn?'sound':'mute');$('#soundBtn').setAttribute('aria-label',soundOn?'关闭声音':'开启声音');tone(660,.15);if(modal==='settings')openSettings();break;case'shirt':S.shirt=id;save();tone(660,.1);break;case'export':exportSave();break;case'import':importSave();break;case'importConfirm':acceptImport();break;case'resetAsk':showSheet('reset',header('和现在的小岛告别？','这会清除本机进度。可先导出存档留念。','leaf')+'<div class="button-row"><button class="secondary" data-action="close">继续现在的生活</button><button class="primary" data-action="resetYes">确认，重新登岛</button></div>');break;case'resetYes':S=newState();P.x=970;P.y=1020;P.path=[];P.target=null;cam.x=P.x;cam.y=P.y-85;navCache=null;initWorld();save();updateHUD();closeSheet();$('#welcome').classList.remove('out');$('#welcome').hidden=false;$('#playerName').value=S.name;break;}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const color=b.dataset.color;if(color){S.shirt=color;$$('#colorPicker button').forEach(x=>x.classList.toggle('selected',x===b));return;}if(b.dataset.action){tone(480,.04,'sine',.025);dispatch(b.dataset.action,b.dataset.id);}const r=b.getBoundingClientRect(),n=document.createElement('i');n.className='tap-bloom';n.style.left=(e.clientX||r.x+r.width/2)+'px';n.style.top=(e.clientY||r.y+r.height/2)+'px';$('#game').append(n);setTimeout(()=>n.remove(),600);});
$('.modal-backdrop').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if((!S.started||!$('#welcome').hidden)&&modal!=='producer')return;if(k==='escape'){if(placing)cancelPlacement();else closeSheet();return;}if(modal){if(k==='tab'){const els=$$('#sheet button:not(:disabled),#sheet input'),first=els[0],last=els.at(-1);if(!els.length){e.preventDefault();return;}if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('#sheet'))){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(e.repeat&&['e','b','c','f'].includes(k))return;if(k==='e'){if(nearest)interactObject(nearest);}else if(k==='b')openBag();else if(k==='c')openCraft();else if(k==='f')openDecorate();else if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){keys.add(k);P.path=[];P.target=null;}});
document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();joy.x=joy.y=0;});document.addEventListener('visibilitychange',()=>{keys.clear();joy.x=joy.y=0;if(document.hidden)save();lastFrame=performance.now();});
let joyPointer=null;$('#joystick').addEventListener('pointerdown',e=>{if(modal||!$('#welcome').hidden)return;joyPointer=e.pointerId;$('#joystick').setPointerCapture(e.pointerId);moveJoy(e);});$('#joystick').addEventListener('pointermove',e=>{if(joyPointer===e.pointerId)moveJoy(e);});function moveJoy(e){const r=$('#joystick').getBoundingClientRect(),x=e.clientX-r.x-r.width/2,y=e.clientY-r.y-r.height/2,d=Math.hypot(x,y),limit=30;joy.x=d>6?x/Math.max(d,limit):0;joy.y=d>6?y/Math.max(d,limit):0;$('#joyKnob').style.transform=`translate(${joy.x*limit}px,${joy.y*limit}px)`;P.path=[];P.target=null;}for(const ev of['pointerup','pointercancel','lostpointercapture'])$('#joystick').addEventListener(ev,()=>{joyPointer=null;joy.x=joy.y=0;$('#joyKnob').style.transform='';});
function screenToWorld(x,y){return{x:(x-W/2)/cam.zoom+cam.x,y:(y-H/2)/cam.zoom+cam.y};}
let pointers=new Map(),down=null,pinch=null;canvas.addEventListener('pointerdown',e=>{if(modal||!$('#welcome').hidden)return;canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});down={x:e.clientX,y:e.clientY,at:performance.now()};if(pointers.size===2){let p=[...pointers.values()];pinch={d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),z:cam.goalZoom};down=null;}});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)){hover=screenToWorld(e.clientX,e.clientY);return;}pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pinch&&pointers.size===2){let p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);cam.goalZoom=Math.max(.45,Math.min(1.6,pinch.z*d/pinch.d));}else if(down&&Math.hypot(down.x-e.clientX,down.y-e.clientY)>12){if(W>650){manualCamera={x:cam.x-(e.clientX-down.x)/cam.zoom,y:cam.y-(e.clientY-down.y)/cam.zoom,until:clock+2};down={x:e.clientX,y:e.clientY,at:0};}}});
canvas.addEventListener('pointerup',e=>{const d=down;pointers.delete(e.pointerId);if(pinch){if(pointers.size<2)pinch=null;down=null;return;}down=null;if(!d||performance.now()-d.at>700||Math.hypot(e.clientX-d.x,e.clientY-d.y)>15)return;const p=screenToWorld(e.clientX,e.clientY);if(placing){placing.x=Math.round(p.x/28)*28;placing.y=Math.round(p.y/28)*28;tone(540,.07);return;}const target=objectAt(p.x,p.y);if(target)approach(target);else{P.target=null;if(routeTo(p.x,p.y)){rings.push({x:p.x,y:p.y,t:clock});tone(650,.05,'sine',.015);}else toast('这里暂时走不过去，试试旁边的空地。');}});canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);pinch=null;down=null;});canvas.addEventListener('wheel',e=>{e.preventDefault();cam.goalZoom=Math.max(.45,Math.min(1.6,cam.goalZoom-e.deltaY*.001));},{passive:false});
function objectAt(x,y){let list=S.room?[{id:900,kind:'exit',x:1100,y:1120},...S.decor.filter(o=>o.room)]:objects.concat(S.decor.filter(o=>!o.room));list=[...list].sort((a,b)=>b.y-a.y);for(const o of list){if(o.kind==='flower'||['shell','branch','bottle','dig'].includes(o.kind)&&isGathered(o.id))continue;const h=['fruit','tree','pine'].includes(o.kind)?155:['home','shop','neighborhouse'].includes(o.kind)?185:o.kind==='npc'?90:45,w=['home','shop','neighborhouse'].includes(o.kind)?90:['fruit','tree','pine'].includes(o.kind)?50:o.kind==='pond'?60:38;if(x>o.x-w&&x<o.x+w&&y>o.y-h&&y<o.y+22)return o;}if(!S.room&&landCtx.isPointInPath(pond,x,y))return objects.find(o=>o.kind==='pond');return null;}
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';if(!lastFrame){cam.zoom=cam.goalZoom=W<650?.86:1.02;}}
function update(dt){clock+=dt;if(S.started&&$('#welcome').hidden&&!document.hidden){if(modal!=='sleeping')tickIsland(dt);S.elapsed+=dt;}
let dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0)+joy.x,dy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0)+joy.y;P.walking=false;
if(!modal&&!placing&&S.started&&$('#welcome').hidden){if(dx||dy){const d=Math.hypot(dx,dy);dx/=Math.max(1,d);dy/=Math.max(1,d);movePlayer(dx*152*dt,dy*152*dt);}else if(P.path.length){const next=P.path[0],d=Math.hypot(next.x-P.x,next.y-P.y),step=152*dt;if(d<step+1){P.x=next.x;P.y=next.y;P.path.shift();if(!P.path.length&&P.target){const o=P.target;P.target=null;if(Math.hypot(P.x-o.x,P.y-o.y)<145)interactObject(o);else toast('已经走近了，再点一次就能互动。');}}else movePlayer((next.x-P.x)/d*step,(next.y-P.y)/d*step);}}
let cx=P.x,cy=P.y-(W<650?55:65);if(manualCamera&&manualCamera.until>clock&&!P.walking){cx=manualCamera.x;cy=manualCamera.y;}cam.x+=(cx-cam.x)*Math.min(1,dt*5.5);cam.y+=(cy-cam.y)*Math.min(1,dt*5.5);cam.zoom+=(cam.goalZoom-cam.zoom)*Math.min(1,dt*7);
if(!S.room){for(const o of objects.filter(o=>o.kind==='npc')){syncRoutine(o);if(P.target===o||modal==='neighbor'&&Math.hypot(P.x-o.x,P.y-o.y)<160){o.walking=false;continue;}o.wait-=dt;if(o.wait<=0){if(!o.dest){o.dest={x:o.homeX+(Math.random()-.5)*100,y:o.homeY+(Math.random()-.5)*90};if(!walkable(o.dest.x,o.dest.y))o.dest=null;o.wait=2;}else{let d=Math.hypot(o.dest.x-o.x,o.dest.y-o.y);if(d<4){o.dest=null;o.wait=3+Math.random()*4;o.walking=false;}else{o.x+=(o.dest.x-o.x)/d*22*dt;o.y+=(o.dest.y-o.y)/d*22*dt;o.walking=true;}}}}}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.text)p.vy+=150*dt;if(p.life<=0)particles.splice(i,1);}rings=rings.filter(r=>clock-r.t<1.2);}
function movePlayer(dx,dy){if(!solidAt(P.x+dx,P.y)){P.x+=dx;if(Math.abs(dx)>.01)P.face=dx>0?1:-1;P.walking=true;}if(!solidAt(P.x,P.y+dy)){P.y+=dy;P.walking=true;}}
function drawWater(g){g.fillStyle='#60b7b7';g.fillRect(0,0,W,H);const zoom=cam.zoom;g.save();g.translate(W/2-cam.x*zoom,H/2-cam.y*zoom);g.scale(zoom,zoom);for(let i=0;i<210;i++){const x=rnd(i+888)*(WORLD_W+200)-100,y=rnd(i+999)*(WORLD_H+200)-100,osc=Math.sin(clock*1.2+i)*7;line(g,[[x+osc,y],[x+20+osc,y]],'#c6e4d24a',2);}g.restore();}
function render(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);drawWater(ctx);ctx.save();ctx.translate(W/2,H/2);ctx.scale(cam.zoom,cam.zoom);ctx.translate(-cam.x,-cam.y);if(S.room)renderInterior(ctx);else {ctx.drawImage(groundCache,0,0);drawTiles(ctx);}
if(!S.room){ctx.save();ctx.globalAlpha=.12;ctx.translate(0,5+Math.sin(clock)*2);ctx.strokeStyle='#fff4cb';ctx.lineWidth=7;ctx.stroke(landPath);ctx.restore();

for(let i=0;i<4;i++){const x=1410+i*49,y=647+Math.sin(i*3)*51;ellipse(ctx,x,y,10,5,'#9fbe8a');line(ctx,[[x,y],[x+7,y-3]],'#76a078',1);}for(let i=0;i<3;i++){const x=1430+i*70+Math.sin(clock*.4+i)*25,y=700+Math.cos(clock*.5+i)*20;ellipse(ctx,x,y,12,4,'#507f772c');poly(ctx,[[x-12,y],[x-20,y-5],[x-19,y+5]],'#507f772c');}}

let list=(S.room?[]:objects).concat(S.decor.filter(o=>!!o.room===!!S.room));if(S.room)list=list.concat([{kind:'bed',x:855,y:890},{kind:'table',x:1300,y:900},{kind:'planter',x:1390,y:830},{kind:'lamp',x:792,y:815}]);if(!S.room&&picnicReady())list.push({kind:'southScene',x:1713,y:1960});list=list.concat([{kind:'player',x:P.x,y:P.y}]).sort((a,b)=>a.y-b.y);

if(!S.room&&skyPhase(S.time)!=='night'){for(let i=0;i<9;i++){const x=700+Math.sin(clock*.17+i*7)*450,y=780+Math.cos(clock*.13+i*3)*360;const flap=Math.abs(Math.sin(clock*8+i))*5;ellipse(ctx,x-flap/2,y-30,flap,3,['#fff0c2','#edc5b1','#e4dfbb'][i%3]);ellipse(ctx,x+flap/2,y-30,flap,3,['#fff0c2','#edc5b1','#e4dfbb'][i%3]);}}
ctx.restore();if(!S.room)drawIslandLight(ctx);const vignette=ctx.createRadialGradient(W/2,H*.45,H*.2,W/2,H*.45,Math.max(W,H)*.8);vignette.addColorStop(0,'#e9ecbd00');vignette.addColorStop(1,'#386e641b');ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);}
